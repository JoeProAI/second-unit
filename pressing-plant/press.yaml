# Pressing Plant pipeline config. The stem list is deliberately NOT here:
# stems are discovered from the WAV filenames in each inbox drop, so any
# stem set Suno exports (vocals / instrumental / drums / bass / other /
# whatever's next) works unchanged. Only analysis preferences live here.

sample_rate: 44100
length_tolerance_s: 0.5
normalize_peak_dbfs: -1.0
silence_floor: 0.001
clip_fraction: 0.001
min_video_length_s: 10.0
default_shot_length_s: 4.0
beat_stem_priority: [drums, instrumental, other]
