name: pressing-plant

on:
  push:
    branches: [main]
    paths:
      - "pressing-plant/**"
      - ".github/workflows/pressing-plant.yml"
  pull_request:
    paths:
      - "pressing-plant/**"
      - ".github/workflows/pressing-plant.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pressing-plant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        env:
          PRESS_INBOX_DIR: ${{ runner.temp }}/inbox
          PRESS_OUTPUT_DIR: ${{ runner.temp }}/out
        run: |
          press fixture ci-song
          press all ci-song --dry-run
